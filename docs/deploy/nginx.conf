# Nginx + PHP-FPM server block for the Katha platform.
# Copy to /etc/nginx/sites-available/katha, adjust names/paths, symlink into sites-enabled,
# then: nginx -t && systemctl reload nginx
#
# root is the project's public/ directory: .env, var/, config/, src/ and vendor/ are never reachable.

server {
    listen 80;
    listen [::]:80;
    server_name katha.example.org www.katha.example.org;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://katha.example.org$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name katha.example.org;

    root /var/www/katha/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/katha.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/katha.example.org/privkey.pem;

    # Keep in sync with php.ini upload_max_filesize / post_max_size (images ≤ 8 MB).
    client_max_body_size 12m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # Hidden files (.env, .git, .htaccess ...) — except ACME challenges.
    location ~ /\.(?!well-known/) { deny all; }

    # AssetMapper output (content-hashed file names).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Uploaded / generated media: static data only, never executed.
    location /media/ {
        location ~* \.(php\d?|phtml|phar|cgi|pl|py|sh|html?|shtml)$ { deny all; }
        location ~* \.svg$ {
            add_header X-Content-Type-Options "nosniff";
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:";
            expires 30d;
        }
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff";
        expires 30d;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Only the front controller is executed.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60s;
        internal;
    }

    # Any other .php file: 404 (no stray scripts can run).
    location ~ \.php$ { return 404; }

    # Optional: let nginx stream narration files (X-Accel-Redirect) — set APP_X_SENDFILE=1 in .env.local.
    # Symfony's BinaryFileResponse then sends "X-Accel-Redirect: /private-files/<path>".
    # location /private-files/ {
    #     internal;
    #     alias /var/www/katha/var/storage/private/;
    # }
    # and pass the mapping to PHP inside the index.php location:
    #     fastcgi_param HTTP_X_SENDFILE_TYPE X-Accel-Redirect;
    #     fastcgi_param HTTP_X_ACCEL_MAPPING /var/www/katha/var/storage/private/=/private-files/;

    access_log /var/log/nginx/katha-access.log;
    error_log  /var/log/nginx/katha-error.log;
}
