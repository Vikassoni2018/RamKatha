# Apache 2.4 + PHP-FPM virtual host for the Katha platform.
# Copy to /etc/apache2/sites-available/katha.conf, adjust names/paths, then:
#   a2enmod rewrite headers proxy_fcgi setenvif ssl http2 && a2ensite katha && systemctl reload apache2
#
# The DocumentRoot is the project's public/ directory: .env, var/, config/, src/ and vendor/ are
# therefore never reachable over HTTP.

<VirtualHost *:80>
    ServerName katha.example.org
    ServerAlias www.katha.example.org
    # Let certbot answer ACME challenges, redirect everything else to HTTPS.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://katha.example.org%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName katha.example.org
    Protocols h2 http/1.1

    DocumentRoot /var/www/katha/public

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/katha.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/katha.example.org/privkey.pem

    # Uploads: keep in sync with php.ini upload_max_filesize / post_max_size (images ≤ 8 MB).
    LimitRequestBody 12582912

    <Directory /var/www/katha/public>
        AllowOverride None
        Require all granted
        Options -Indexes -MultiViews
        FallbackResource /index.php
    </Directory>

    # PHP-FPM: only the front controller is ever executed.
    <FilesMatch "^index\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>
    <LocationMatch "^/(?!index\.php$).*\.(?i:php\d?|phtml|phar)$">
        Require all denied
    </LocationMatch>
    # Pass the Authorization header to PHP.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    # Hidden files (.env, .git, .htaccess) are never served.
    <LocationMatch "/\.(?!well-known/)">
        Require all denied
    </LocationMatch>

    # Uploaded / generated media: data only, long cache, no sniffing.
    <Directory /var/www/katha/public/media>
        Options -Indexes -ExecCGI
        <FilesMatch "(?i)\.(php\d?|phtml|phar|cgi|pl|py|sh|html?|shtml)$">
            Require all denied
        </FilesMatch>
        Header set X-Content-Type-Options "nosniff"
        Header set Cache-Control "public, max-age=2592000"
        <FilesMatch "(?i)\.svg$">
            Header set Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:"
        </FilesMatch>
    </Directory>

    # AssetMapper output (content-hashed file names).
    <Directory /var/www/katha/public/assets>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Optional: let Apache stream narration files (mod_xsendfile) — set APP_X_SENDFILE=1 in .env.local.
    # XSendFile On
    # XSendFilePath /var/www/katha/var/storage/private

    # Gzip/Brotli for text assets.
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml application/xml text/plain
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/katha-error.log
    CustomLog ${APACHE_LOG_DIR}/katha-access.log combined
</VirtualHost>
