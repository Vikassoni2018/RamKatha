; Supervisor alternative to the systemd unit (use one or the other).
; Install: cp docs/deploy/supervisor-katha.conf /etc/supervisor/conf.d/katha.conf
;          supervisorctl reread && supervisorctl update && supervisorctl start katha-worker:*
; After each deployment: php bin/console messenger:stop-workers

[program:katha-worker]
command=/usr/bin/php /var/www/katha/bin/console messenger:consume async scheduler_default --time-limit=3600 --memory-limit=256M --no-interaction
directory=/var/www/katha
user=www-data
environment=APP_ENV="prod"
numprocs=1
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=330
stdout_logfile=/var/log/supervisor/katha-worker.log
stderr_logfile=/var/log/supervisor/katha-worker-error.log
