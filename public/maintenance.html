<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>रखरखाव जारी है</title>
    <style>
        body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:#fbf7f0;color:#2b1d16;font-family:"Noto Sans Devanagari","Nirmala UI","Mangal",system-ui,sans-serif;line-height:1.7;text-align:center}
        main{max-width:34rem}
        .mark{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:18px;background:#7a1f2b;color:#ffd9a8;font-size:2rem;margin-bottom:1rem}
        h1{font-family:"Noto Serif Devanagari",Georgia,serif;font-size:1.7rem;margin:0 0 .75rem}
        p{color:#66554a}
    </style>
</head>
<body>
<main>
    <div class="mark" aria-hidden="true">🪔</div>
    <h1>रखरखाव जारी है</h1>
    <p>हम वेबसाइट का रखरखाव कर रहे हैं। कृपया कुछ मिनट बाद पुनः पधारें।</p>
    <p lang="en"><small>We are performing scheduled maintenance. Please check back in a few minutes.</small></p>
</main>
</body>
</html>
