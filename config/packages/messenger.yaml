framework:
    messenger:
        failure_transport: failed

        transports:
            # Database-backed queue (Doctrine transport). No Redis/RabbitMQ required.
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: default
                retry_strategy:
                    max_retries: 3
                    delay: 60000
                    multiplier: 3
                    max_delay: 3600000
            failed: 'doctrine://default?queue_name=failed&auto_setup=0'
            sync: 'sync://'

        routing:
            'App\Message\GenerateStoryAudio': async
            'App\Message\PublishSocialPost': async
            'App\Message\GenerateAudiogram': async
            'App\Message\SendAdminNotificationEmail': async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                failed: 'in-memory://'
